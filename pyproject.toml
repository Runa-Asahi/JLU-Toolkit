[project]
name = "jlu-toolkit"
dynamic = ["version"]
description = "吉大课表/成绩本地工具：导入文件或从教务 HTTP 拉取、计算绩点、导出 iCal，并提供 MCP 接口"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Runa-Asahi" }]
requires-python = ">=3.9"
keywords = ["jlu", "吉林大学", "课表", "绩点", "ical", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Natural Language :: Chinese (Simplified)",
]
# keyring + cryptography：凭据/会话加密存储；缺失时自动退回 0600 明文文件（见 secure_store.py）
dependencies = [
    "keyring>=24",
    "cryptography>=41",
]
[project.urls]
Homepage = "https://github.com/Runa-Asahi/JLU-Toolkit"
Issues = "https://github.com/Runa-Asahi/JLU-Toolkit/issues"
[project.optional-dependencies]
mcp = ["mcp>=1.0"]
captcha = ["pillow>=9.0"]
ocr = ["pillow>=9.0", "ddddocr"]
desktop = ["pystray>=0.19", "pillow>=9.0"]
notify = ["plyer>=2.0"]
[project.scripts]
jlu-toolkit = "jlu_toolkit.cli:main"
superjlu = "jlu_toolkit.cli:main"
jlu-toolkit-mcp = "jlu_toolkit.mcp_server:main"
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "jlu_toolkit.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["jlu_toolkit*"]

[tool.setuptools.package-data]
jlu_toolkit = ["data/*", "data/demo/*"]
