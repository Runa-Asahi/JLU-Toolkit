name: Build SuperJLU.exe

# 只在手动运行或推 v* 标签时构建（Runa 测试完成前不自动打包，不加 push 触发）。
# 产物：SuperJLU.exe + SHA256，作为 Actions artifact 上传（不创建 Release）。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[desktop,captcha]" pyinstaller pytest
      - name: Test
        run: pytest -q
      - name: Build
        run: python packaging/build_windows.py
      - name: Smoke test (imports in frozen exe)
        shell: pwsh
        run: |
          if (!(Test-Path dist\SuperJLU.exe)) { throw "SuperJLU.exe 未生成" }
          (Get-Item dist\SuperJLU.exe).Length
      - name: SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\SuperJLU.exe -Algorithm SHA256).Hash.ToLower()
          "$h  SuperJLU.exe" | Out-File -Encoding ascii dist\SuperJLU.exe.sha256
          Get-Content dist\SuperJLU.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SuperJLU-windows
          path: |
            dist/SuperJLU.exe
            dist/SuperJLU.exe.sha256
